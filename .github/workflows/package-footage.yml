name: Package Gamecocks Footage
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: gamecocks-footage
          path: |
            public/sellers1.mp4
            public/sellers2.mp4
            public/cinematic.mp4
            public/premium/*.mp4
          if-no-files-found: error
          retention-days: 7
