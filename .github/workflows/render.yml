name: Render Gamecocks Edit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project
        run: npm install

      - name: Install browser + media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Capture BankRollJu song segment
        run: |
          mkdir -p public out
          node capture-song.mjs

      - name: Capture public ESPN Sellers clips
        run: npm run capture

      - name: Verify media
        run: |
          ls -lh public
          for f in public/sellers1.mp4 public/sellers2.mp4 public/cinematic.mp4 public/song.mp3; do test -s "$f"; done

      - name: Render vertical edit
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: gamecocks-sellers-edit
          path: out/gamecocks-sellers-edit.mp4
          if-no-files-found: error
          retention-days: 7
