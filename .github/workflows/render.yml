name: Publish Gamecocks Footage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and media tools
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture premium Sellers pool
        run: npm run capture
      - name: Verify footage
        run: ls -lh public/premium
      - uses: actions/upload-artifact@v4
        with:
          name: premium-sellers-pool
          path: public/premium/*.mp4
          if-no-files-found: error
          retention-days: 7
