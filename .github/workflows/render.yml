name: Render Gamecocks Edit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media tools
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Inspect SEC embedded player data
        run: |
          URL='https://www.secsports.com/videos/2024/11/highlight-sellers-seals-scintillating-south-carolina-win-at-clemson'
          curl -L -sS -A 'Mozilla/5.0' "$URL" -o /tmp/sec.html
          echo '=== candidate media urls ==='
          grep -Eo 'https?:[^"'"'"' <>]+(m3u8|mp4)[^"'"'"' <>]*' /tmp/sec.html | sed 's/\\u0026/\&/g' | head -30 || true
          echo '=== player clues ==='
          grep -Eoi '.{0,160}(m3u8|mp4|videoId|video_id|playback|mediaId|media_id|espncdn|brightcove|akamai).{0,260}' /tmp/sec.html | head -50 || true
          echo '=== script/json clues ==='
          grep -Eoi '<script[^>]*(application/ld\+json|__NEXT_DATA__|type="application/json")[^>]*>[^<]{0,3000}' /tmp/sec.html | head -20 || true
          exit 1

      - name: Download official Apple Music preview
        if: ${{ false }}
        run: |
          curl -L -s 'https://itunes.apple.com/search?term=BankRollJu%20LaNorris%20Sellers&entity=song&limit=20' -o /tmp/itunes.json
          PREVIEW=$(jq -r '.results[] | select((.artistName|ascii_downcase)=="bankrollju" and (.trackName|ascii_downcase|contains("lanorris sellers"))) | .previewUrl' /tmp/itunes.json | head -1)
          test -n "$PREVIEW" && test "$PREVIEW" != "null"
          curl -L "$PREVIEW" -o /tmp/song-preview.m4a
          ffmpeg -y -i /tmp/song-preview.m4a -vn -codec:a libmp3lame -q:a 1 public/song.mp3
