name: Publish Gamecocks Footage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'Store premium Sellers footage') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project
        run: npm install
      - name: Install browser + media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture premium Sellers pool
        run: npm run capture
      - name: Verify footage
        run: |
          ls -lh public/premium
          for f in public/premium/clemson.mp4 public/premium/kentstate.mp4 public/premium/coastal.mp4 public/premium/odu.mp4 public/premium/escape.mp4 public/premium/hurdle.mp4; do test -s "$f"; done
      - name: Commit footage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/premium/*.mp4
          git commit -m 'Store premium Sellers footage' || exit 0
          git push
