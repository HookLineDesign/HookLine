name: Render Gamecocks Edit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media tools
        run: |
          python -m pip install --upgrade pip yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Download ESPN Sellers clips
        run: |
          mkdir -p public out
          yt-dlp --no-playlist --merge-output-format mp4 -o 'public/sellers1.%(ext)s' 'https://www.espn.com/watch/player/_/id/42700754'
          yt-dlp --no-playlist --merge-output-format mp4 -o 'public/sellers2.%(ext)s' 'https://www.espn.com/video/clip/_/id/42697706'
          yt-dlp --no-playlist --merge-output-format mp4 -o 'public/cinematic.%(ext)s' 'https://www.espn.com/video/clip/_/id/42159145'

      - name: Download official Apple preview
        run: |
          curl -L -s 'https://itunes.apple.com/search?term=BankRollJu%20LaNorris%20Sellers&entity=song&limit=20' -o /tmp/itunes.json
          PREVIEW=$(jq -r '.results[] | select((.artistName|ascii_downcase)=="bankrollju" and (.trackName|ascii_downcase|contains("lanorris sellers"))) | .previewUrl' /tmp/itunes.json | head -1)
          test -n "$PREVIEW" && test "$PREVIEW" != "null"
          curl -L "$PREVIEW" -o /tmp/song-preview.m4a
          ffmpeg -y -i /tmp/song-preview.m4a -vn -codec:a libmp3lame -q:a 1 public/song.mp3

      - name: Normalize video files
        run: |
          for stem in sellers1 sellers2 cinematic; do
            f=$(find public -maxdepth 1 -type f -name "$stem.*" | head -1)
            test -n "$f"
            ffmpeg -y -i "$f" -c:v libx264 -preset fast -crf 18 -an "public/$stem.normalized.mp4"
            mv "public/$stem.normalized.mp4" "public/$stem.mp4"
          done

      - name: Install project
        run: npm install

      - name: Render vertical edit
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: gamecocks-sellers-edit
          path: out/gamecocks-sellers-edit.mp4
          if-no-files-found: error
          retention-days: 7
